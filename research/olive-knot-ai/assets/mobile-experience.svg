<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1400 680"><title id="title">Olive Knot AI mobile prototype results</title><desc id="desc">Illustrated interface reconstruction using two supplied mobile screenshots. Stage 1: 98.03%, Stage 2: 1.62%, Stage 4: 0.35%. Stage 4: 93.27%, Stage 2: 5.06%, Stage 1: 1.67%. Individual prediction confidence scores, not validation accuracy.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c1f1a"/><stop offset="1" stop-color="#19382c"/></linearGradient><linearGradient id="photo" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#a6a784"/><stop offset="1" stop-color="#526b4a"/></linearGradient><style>.cap,.hi{font-family:Arial,sans-serif}.hi{fill:#f2f1e5;font-weight:700}.cap{fill:#acbdad}.screen{fill:#192d27;stroke:#617b64;stroke-width:2}.card{fill:#fbf8f0}.row,.val{font-family:Arial,sans-serif;font-size:18px;fill:#435746}.val{font-weight:700;fill:#254938}</style></defs><rect width="1400" height="680" fill="url(#bg)" rx="22"/><path stroke="#c9b88a" stroke-width="5" d="M50 55H190"/><text x="50" y="100" class="hi" font-size="36">On-device predictions</text><text x="50" y="135" class="cap" font-size="20">Illustrated reconstruction from two original prototype screenshots</text><g transform="translate(250 166)"><rect width="390" height="444" class="screen" rx="25"/><rect width="362" height="269" x="14" y="14" fill="url(#photo)" rx="16"/><path fill="none" stroke="#4c5b39" stroke-linecap="round" stroke-width="12" d="M188 46 C174 89 176 141 186 218"/><path fill="#c6cf90" d="M179 88 C119 44 104 92 162 117 C186 122 190 102 179 88Z"/><path fill="#a4b77f" d="M185 137 C255 99 260 147 206 167 C187 166 180 150 185 137Z"/><path fill="#cbd7a1" d="M188 167 C111 138 101 193 168 205 C186 203 193 185 188 167Z"/><circle cx="164" cy="145" r="21" fill="none" stroke="#e3b971" stroke-dasharray="5 5" stroke-width="3"/><text x="28" y="48" fill="#f7f9ef" font-family="Arial,sans-serif" font-size="17" font-weight="700">Stage analysis</text><rect width="362" height="153" x="14" y="277" class="card" rx="15"/><text x="34" y="315" class="row">Stage 1</text><text x="342" y="315" class="val" text-anchor="end">98.03%</text><rect width="308" height="6" x="34" y="327" fill="#e2e8db" rx="3"/><rect width="302" height="6" x="34" y="327" fill="#4e7b5b" rx="3"/><text x="34" y="360" class="row">Stage 2</text><text x="342" y="360" class="val" text-anchor="end">1.62%</text><text x="34" y="398" class="row">Stage 4</text><text x="342" y="398" class="val" text-anchor="end">0.35%</text></g><g transform="translate(760 166)"><rect width="390" height="444" class="screen" rx="25"/><rect width="362" height="269" x="14" y="14" fill="#5b6551" rx="16"/><path fill="none" stroke="#5a503c" stroke-linecap="round" stroke-width="23" d="M145 42 C176 112 179 180 202 229"/><path fill="#b3be7b" d="M157 81 C96 32 82 84 137 115 C165 115 170 102 157 81Z"/><path fill="#a4af75" d="M168 146 C241 117 255 170 189 189 C172 183 166 160 168 146Z"/><path fill="#bcc896" d="M169 197 C113 156 98 203 165 228 C187 225 183 205 169 197Z"/><ellipse cx="184" cy="145" fill="#8e7f59" stroke="#c6b58c" stroke-width="3" rx="29" ry="39"/><circle cx="184" cy="145" r="49" fill="none" stroke="#e3b971" stroke-dasharray="5 5" stroke-width="3"/><text x="28" y="48" fill="#f7f9ef" font-family="Arial,sans-serif" font-size="17" font-weight="700">Stage analysis</text><rect width="362" height="153" x="14" y="277" class="card" rx="15"/><text x="34" y="315" class="row">Stage 4</text><text x="342" y="315" class="val" text-anchor="end">93.27%</text><rect width="308" height="6" x="34" y="327" fill="#e2e8db" rx="3"/><rect width="287" height="6" x="34" y="327" fill="#4e7b5b" rx="3"/><text x="34" y="360" class="row">Stage 2</text><text x="342" y="360" class="val" text-anchor="end">5.06%</text><text x="34" y="398" class="row">Stage 1</text><text x="342" y="398" class="val" text-anchor="end">1.67%</text></g><text x="700" y="644" class="cap" font-size="16" text-anchor="middle">Model confidence for these two examples; not accuracy or independent field validation.</text></svg>