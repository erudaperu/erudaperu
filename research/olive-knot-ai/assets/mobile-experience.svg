<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">Olive Knot AI mobile prototype results</title><desc id="desc">Illustrated interface reconstruction using two supplied mobile screenshots. Stage 1: 98.03%, Stage 2: 1.62%, Stage 4: 0.35%. Stage 4: 93.27%, Stage 2: 5.06%, Stage 1: 1.67%. Individual prediction confidence scores, not validation accuracy.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1f1a"/><stop offset="1" stop-color="#19382c"/></linearGradient><linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6a784"/><stop offset="1" stop-color="#526b4a"/></linearGradient><style>
