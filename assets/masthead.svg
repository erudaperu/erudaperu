  <circle cx="83" cy="54" r="6" fill="#89EBCB"/>
  <text x="102" y="61" fill="#DDF6EC" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">COMPUTER ENGINEERING · uOTTAWA</text>
  <text x="57" y="192" fill="#F7FAF6" font-family="Arial,Helvetica,sans-serif" font-size="111" font-weight="800" letter-spacing="-5">Hi, I'm <tspan fill="#92EBCF">Eren.</tspan></text>
  <text x="63" y="239" fill="#D1E0E1" font-family="Arial,Helvetica,sans-serif" font-size="32">I like making ideas real, then seeing how they hold up.</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="1.3">
    <rect x="61" y="285" width="156" height="42" rx="21" fill="#233D40" stroke="#73DCC4"/><text x="91" y="312" fill="#DDF7E9">SOFTWARE</text>
    <rect x="229" y="285" width="164" height="42" rx="21" fill="#3C3032" stroke="#FFAE89"/><text x="259" y="312" fill="#FFE3CB">HARDWARE</text>
    <rect x="405" y="285" width="156" height="42" rx="21" fill="#2A3343" stroke="#9CB7F4"/><text x="440" y="312" fill="#E4EAFB">RESEARCH</text>
  </g>
