<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" aria-labelledby="title description" role="img" viewBox="0 0 1400 390"><title id="title">Hi, I&apos;m Eren Arikan</title><desc id="description">A warm, energetic profile banner: Eren introduces himself as a curious computer engineering student. Colorful cards sketch a path from an idea through code and measurement.</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10232B"/><stop offset=".55" stop-color="#0E1A24"/><stop offset="1" stop-color="#172033"/></linearGradient><linearGradient id="cool" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#A8F0D2"/><stop offset="1" stop-color="#58C9CA"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" fill="#9FB4C1" opacity=".2"/></pattern></defs><rect width="1400" height="390" fill="url(#background)"/><rect width="1400" height="390" fill="url(#dots)"/><circle cx="1320" cy="35" r="170" fill="#64D9C5" opacity=".08"/><circle cx="1006" cy="380" r="192" fill="#FFA582" opacity=".065"/><path stroke="#6EE1CD" stroke-width="7" d="M0 383H1400"/><rect width="405" height="38" x="58" y="35" fill="#183A40" stroke="#5BBEA8" stroke-opacity=".7" rx="19"/><circle cx="83" cy="54" r="6" fill="#89EBCB"/><text x="102" y="61" fill="#DDF6EC" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">COMPUTER ENGINEERING · uOTTAWA</text><text x="57" y="192" fill="#F7FAF6" font-family="Arial,Helvetica,sans-serif" font-size="111" font-weight="800" letter-spacing="-5">Hi, I&apos;m <tspan fill="#92EBCF">Eren.</tspan></text><text x="63" y="239" fill="#D1E0E1" font-family="Arial,Helvetica,sans-serif" font-size="32">I like making ideas real, then seeing how they hold up.</text><g font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="1.3"><rect width="156" height="42" x="61" y="285" fill="#233D40" stroke="#73DCC4" rx="21"/><text x="91" y="312" fill="#DDF7E9">SOFTWARE</text><rect width="164" height="42" x="229" y="285" fill="#3C3032" stroke="#FFAE89" rx="21"/><text x="259" y="312" fill="#FFE3CB">HARDWARE</text><rect width="156" height="42" x="405" y="285" fill="#2A3343" stroke="#9CB7F4" rx="21"/><text x="440" y="312" fill="#E4EAFB">RESEARCH</text></g><g transform="translate(925 48) rotate(-8 184 140)"><rect width="378" height="264" x="25" y="37" fill="#07131A" stroke="#47636B" stroke-width="2" rx="24"/><rect width="378" height="264" x="0" y="0" fill="#1A2E35" stroke="#8FDACB" stroke-width="3" rx="24"/><path stroke="#5D8E8B" stroke-width="2" d="M0 50H378"/><circle cx="25" cy="25" r="6" fill="#FF9B88"/><circle cx="46" cy="25" r="6" fill="#F6C782"/><circle cx="67" cy="25" r="6" fill="#84D9BD"/><text x="29" y="94" fill="#E5F6EF" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">curiosity → prototype</text><path fill="none" stroke="#739395" stroke-width="2" d="M32 215H342M32 215V119"/><path fill="none" stroke="url(#cool)" stroke-linecap="round" stroke-width="7" d="M39 191C83 177 111 197 147 157S211 176 250 132S302 155 339 101"/><circle cx="147" cy="157" r="8" fill="#92EBCF"/><circle cx="250" cy="132" r="8" fill="#92EBCF"/><circle cx="339" cy="101" r="9" fill="#FFC48F"/><text x="33" y="245" fill="#A4C7C5" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="1.2">build · measure · learn</text></g><g fill="none" stroke-linecap="round"><path stroke="#FFB493" stroke-width="4" d="M861 76l16 0m-8-8l0 16"/><path stroke="#90E9D0" stroke-width="4" d="M1340 279l18 0m-9-9l0 18"/><circle cx="867" cy="335" r="7" stroke="#FFB493" stroke-width="3"/></g><text x="1338" y="357" fill="#A8C8C6" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="2" text-anchor="end">EREN ARIKAN / 2026</text></svg>