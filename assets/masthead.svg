<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Eren Arikan</title>
  <desc id="description">A warm, energetic profile banner: Eren introduces himself as a curious computer engineering student. Colorful cards sketch a path from an idea through code and measurement.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10232B"/><stop offset=".55" stop-color="#0E1A24"/><stop offset="1" stop-color="#172033"/></linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A8F0D2"/><stop offset="1" stop-color="#58C9CA"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" fill="#9FB4C1" opacity=".2"/></pattern>
  </defs>
  <rect width="1400" height="390" fill="url(#background)"/><rect width="1400" height="390" fill="url(#dots)"/>
  <circle cx="1320" cy="35" r="170" fill="#64D9C5" opacity=".08"/><circle cx="1006" cy="380" r="192" fill="#FFA582" opacity=".065"/>
